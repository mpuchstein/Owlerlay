name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    permissions:
      contents: write # tauri-action attaches the installers to the release

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: linux
            target: x86_64-unknown-linux-gnu
          - runner: windows
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: matrix.runner == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install JS dependencies
        run: pnpm install

      - name: Build and attach installers to the release
        uses: tauri-apps/tauri-action@v0
        env:
          # Forgejo's Actions runner provides this token and points
          # GITHUB_API_URL at the instance's GitHub-compatible API, so
          # tauri-action attaches assets to the Gitea release the same way.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Attach this build's installers (.deb/.rpm/.AppImage, .msi/.exe) to
          # the release for the pushed tag — no manual artifact re-upload. Both
          # matrix jobs target the same tag; tauri-action find-or-creates the
          # one release and uploads to it.
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
