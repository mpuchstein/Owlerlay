name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    permissions:
      contents: write # tauri-action attaches the installers to the release

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          # Match local pnpm 11; pnpm 9 errors "packages field missing or
          # empty" on our pnpm-workspace.yaml (it has no `packages:` field).
          version: 11

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install JS dependencies
        run: pnpm install

      - name: Build and attach installers to the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Attach this build's installers to the release for the pushed tag.
          # tauri-action finds the existing release (created with notes during
          # the release flow) and uploads the individual bundle files — .deb,
          # .rpm, .AppImage on Linux; .msi, .exe on Windows — so no manual
          # download-from-artifacts + re-upload step is needed. Both matrix
          # jobs target the same tag; tauri-action find-or-creates the one
          # release and uploads to it.
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
